# HERMES signal service — environment-blind, network-isolated deployment.
# WO-HELM-HERMES-ENVIRONMENT-BLIND-ISOLATION-0003 (absorbs the WO-...-CONTAINER-ISOLATION-0002 build base).
#
# "Environment-blind": the stack carries NO host coupling. Every value comes from .env at deploy time;
# the bundled DB is reachable ONLY on the private bridge (no host port), and logs leave the host
# out-of-band via GELF to the SIEM Graylog endpoint. Nothing here is applied automatically.
#
# Build base: the `build:` below uses the two-stage zero-leak Dockerfile + .dockerignore from
# WO-HELM-HERMES-CONTAINER-ISOLATION-0002 (now on main).

services:
  # ---- Bundled MariaDB: PROD-SILOED profile ONLY — NOT started for dev. ----
  # Dev uses the existing shared proteus-mariadb-dev via .env routing (DB_HOST/DB_PORT). The bundled,
  # internal-bridge DB (env-blind/prod-siloed design, WO-...-ISOLATION-0003) is preserved here behind the
  # `siloed` compose profile for the future production deployment (`docker compose --profile siloed up`).
  hermes-mariadb:
    image: mariadb:11.4
    container_name: hermes-mariadb
    restart: unless-stopped
    profiles: ["siloed"]

    # All credentials supplied at deploy time — never baked in. required:false keeps `config` portable.
    env_file:
      - path: .env
        required: false
    environment:
      MARIADB_DATABASE: ${DB_NAME:-tradingSignals}
      MARIADB_USER: ${DB_USER:-hermes}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC

    # NO `ports:` — DELIBERATE. The DB is published to NO host interface; only services on hermes_net
    # (i.e. hermes-signal) can reach it via internal DNS name `hermes-mariadb:3306`. No leak to the host.

    networks:
      - hermes_net

    # Named volume (not host-bound) so the data lane stays host-decoupled.
    volumes:
      - hermes_db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  # ---- HERMES signal service ----
  hermes-signal:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: hermes-signal:${HERMES_IMAGE_TAG:-local}
    container_name: hermes-signal
    restart: unless-stopped

    # (No depends_on: dev targets the EXTERNAL shared DB; the bundled `siloed`-profile DB is brought up
    #  separately for prod. The boot gate + app fail-loud if the configured DB is unreachable.)

    # Runtime configuration supplied at deploy time — never baked into the image.
    env_file:
      - path: .env
        required: false

    # Config-driven targets. env_config (ENVIRONMENT=DEV) resolves the DEV_-prefixed vars, so the clean
    # .env names (DB_HOST/DB_PORT/REDIS_HOST/REDIS_PORT) are mapped here to the DEV_-prefixed container env
    # the app actually reads. Dev -> shared instances (proteus-mariadb-dev :3307, proteus-redis-dev :6380).
    # Defaults are env-blind (container-DNS / dev sandbox), never host-coupled; .env supplies real values.
    # HERMES_CPUS/MEM_LIMIT/PIDS_LIMIT feed the boot gate (resource_cap_verify.py) — mirror the pins below.
    environment:
      DEV_DB_HOST: ${DB_HOST:-hermes-mariadb}
      DEV_DB_PORT: ${DB_PORT:-3306}
      DEV_REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      DEV_REDIS_PORT: ${REDIS_PORT:-6380}
      RUN_ENV: ${RUN_ENV:-STAGING}
      SIGNAL_PORT: ${SIGNAL_PORT:-8211}
      HERMES_CPUS: ${HERMES_CPUS:-4}
      HERMES_MEM_LIMIT: ${HERMES_MEM_LIMIT:-4g}
      HERMES_PIDS_LIMIT: ${HERMES_PIDS_LIMIT:-512}

    # Signal service HTTP port (host:container). Override SIGNAL_PORT/SIGNAL_BIND_PORT via .env.
    ports:
      - "${SIGNAL_BIND_PORT:-8211}:${SIGNAL_PORT:-8211}"

    # ---- Resource pinning: emulate a 4 vCore / 4 GB IONOS M+ VPS ----
    cpus: ${HERMES_CPUS:-4}
    mem_limit: ${HERMES_MEM_LIMIT:-4g}
    mem_reservation: ${HERMES_MEM_RESERVATION:-1g}
    pids_limit: ${HERMES_PIDS_LIMIT:-512}

    # ---- Out-of-band GELF / Graylog log shipping to the SIEM endpoint (WO-0003 requirement #3) ----
    # Prefer SIEM_GRAYLOG_IP (new canonical), fall back to legacy GRAYLOG_HOST, then loopback. Port 12201.
    logging:
      driver: gelf
      options:
        gelf-address: "udp://${SIEM_GRAYLOG_IP:-${GRAYLOG_HOST:-127.0.0.1}}:${SIEM_GRAYLOG_PORT:-12201}"
        tag: "hermes-signal"

    networks:
      - hermes_net

    volumes:
      - hermes_archive:/data/signal_history

    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1', int(os.getenv('SIGNAL_PORT','8211'))))==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    security_opt:
      - no-new-privileges:true

# Single private bridge — no host networking. The DB rides this bridge with no host port; the signal
# service uses it for DB egress and still publishes only its own HTTP port.
networks:
  hermes_net:
    driver: bridge
    name: hermes_net

volumes:
  hermes_archive:
    name: hermes_archive
  hermes_db_data:
    name: hermes_db_data
