# Governed, VERSION-CONTROLLED Advanced-v1 DARK deployment overlay.
# WO-HELM-HERMES-DEPLOYED-PROVENANCE-SCOPE-READINESS-AND-REPRODUCIBLE-DARK-CONFIG-0001.
#
# Purpose: make the safe dark-state controls reproducible from canonical Git (replacing reliance on an untracked
# project-local override). Project-owned, NO secrets, NO live values — environment-specific values come from a governed
# env file (see dark.env.template) via ${VAR} interpolation. Compose ONLY (the seven-new stay dark; XAU pilot preserved).
#
# Compose invocation (project + files fixed for determinism):
#   docker compose -p hermes-dev \
#     -f docker-compose.yml \
#     -f deploy/advanced_v1/docker-compose.dark.yml \
#     up -d hermes-signal
#
# This overlay sets the EXPANSION dark controls EXPLICITLY (not defaults) and pins the image by immutable digest.
services:
  hermes-signal:
    # Immutable runtime identity: pin the digest (preferred) or the governed tag. A mutable tag alone is rejected by
    # dark_config_preflight.py when HERMES_REQUIRE_DIGEST_PIN=true.
    image: "${HERMES_IMAGE_REF:-hermes-signal:${HERMES_IMAGE_TAG:-local}}"
    environment:
      # --- EXPANSION DARK CONTROLS (explicit, auditable; NOT relying on code defaults) ---
      HERMES_ADVANCED_V1_MASTER_ENABLED: "false"
      HERMES_ADVANCED_V1_PUBLISHER_MODE: "DISABLED"
      # --- existing authorised XAU PILOT family controls (governed via env file; pilot preserved) ---
      HERMES_TICK_PUBLISH_ENABLED: "${HERMES_TICK_PUBLISH_ENABLED:-true}"
      HERMES_TICK_PUBLISH_AUTHORISED: "${HERMES_TICK_PUBLISH_AUTHORISED:-true}"
      HERMES_INDICATOR_PUBLISH_ENABLED: "${HERMES_INDICATOR_PUBLISH_ENABLED:-true}"
      HERMES_INDICATOR_PUBLISH_AUTHORISED: "${HERMES_INDICATOR_PUBLISH_AUTHORISED:-true}"
      HERMES_GAPS_PUBLISH_ENABLED: "${HERMES_GAPS_PUBLISH_ENABLED:-true}"
      HERMES_GAPS_PUBLISH_AUTHORISED: "${HERMES_GAPS_PUBLISH_AUTHORISED:-true}"
      HERMES_BACKFILL_STATUS_PUBLISH_ENABLED: "${HERMES_BACKFILL_STATUS_PUBLISH_ENABLED:-true}"
      HERMES_BACKFILL_STATUS_PUBLISH_AUTHORISED: "${HERMES_BACKFILL_STATUS_PUBLISH_AUTHORISED:-true}"
      HERMES_FEED_HEALTH_PUBLISH_ENABLED: "${HERMES_FEED_HEALTH_PUBLISH_ENABLED:-true}"
      HERMES_FEED_HEALTH_PUBLISH_AUTHORISED: "${HERMES_FEED_HEALTH_PUBLISH_AUTHORISED:-true}"
      # --- hard safety invariants (never enabled by this overlay) ---
      CONSUMER_LIVE: "false"
      HERMES_BACKFILL_EXECUTION_ENABLED: "false"
      # NOTE: DB / Redis / OANDA credentials + hosts are supplied ONLY by the governed env file, never here.
